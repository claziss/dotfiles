# REF:
# https://www.rushiagr.com/blog/2016/06/16/everything-you-need-to-know-about-tmux-copy-pasting-ubuntu/
# https://www.rockyourcode.com/copy-and-paste-in-tmux/

# defining the terminal value while running tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# setting the screen buffer size in copy mode: C-b [
set -g history-limit 100000

# using the mouse to scroll in copy mode
# keep in mind for copy/paste you have to hold the shift key
#set -g mode-mouse on     # v1.6-
set-option -g mouse on           # v1.7+
setw -g mode-keys vi
set-option -s set-clipboard off

# Auto-select clipboard commands:
# Wayland -> wl-copy/wl-paste, otherwise -> xclip (X11)
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1 && command -v wl-paste >/dev/null 2>&1' \
  'set -g @clipboard_copy "wl-copy"; set -g @clipboard_paste "wl-paste --no-newline"' \
  'set -g @clipboard_copy "xclip -selection clipboard -i"; set -g @clipboard_paste "xclip -selection clipboard -o"'

bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@clipboard_copy}"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@clipboard_copy}"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@clipboard_copy}"

################################
# Status bar, window and title #
################################

# identifying activity in other windows
#setw -g monitor-activity on
#set -g visual-activity on

# making windows/panes 1-based index
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g status-interval 5
set -g status-left-length 80
set -g status-right-length 200
set -g status-left '#S:#I.#P #{?client_prefix,[PREFIX],}#{?pane_in_mode,[COPY],}#{?window_zoomed_flag,[ZOOM],}'
set -g status-right '#(whoami)@#H | #{b:pane_current_path} | cpu:#(awk -F: "/model name/ {gsub(/^ +/,\"\",$2); print $2; exit}" /proc/cpuinfo 2>/dev/null | sed "s/ (R)//g; s/ (TM)//g; s/@.*//; s/CPU //; s/  */ /g" | cut -c1-20) | gpu:#(if command -v nvidia-smi >/dev/null 2>&1; then nvidia-smi --query-gpu=utilization.gpu,temperature.gpu --format=csv,noheader,nounits 2>/dev/null | head -n1 | awk -F", " "{printf \"NVIDIA %s%%%% %sC\", \$1, \$2}"; else busy=$(ls /sys/class/drm/card*/device/gpu_busy_percent 2>/dev/null | head -n1); if [ -n "$busy" ]; then util=$(cat "$busy" 2>/dev/null); devdir=$(dirname "$busy"); t_raw=$(cat "$devdir"/hwmon/hwmon*/temp1_input 2>/dev/null | head -n1); [ -n "$util" ] || util="0"; if [ -n "$t_raw" ]; then temp=$(awk "BEGIN {printf \"%.0f\", $t_raw/1000}"); else temp="?"; fi; state="/tmp/tmux-gpu-ewma-$UID"; prev=$(cat "$state" 2>/dev/null); if [ -n "$prev" ]; then avg=$(awk "BEGIN {printf \"%.0f\", (($prev*3)+$util)/4}"); else avg="$util"; fi; echo "$avg" > "$state"; printf "AMD %s%%%% %sC" "$avg" "$temp"; else printf "n/a"; fi; fi) | load:#(cut -d" " -f1-3 /proc/loadavg)'

# binding <Ctrl-c>/<Ctrl-v> to copy/paste buffer via selected clipboard backend
bind C-c run "tmux save-buffer - | #{@clipboard_copy}"
bind C-v run "tmux set-buffer \"$(#{@clipboard_paste})\"; tmux paste-buffer"
